<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · ssh-easy{% else %}ssh-easy{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <div class="scanlines"></div>
  <div class="noise"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-logo" href="{{ '/' | relative_url }}">
        <span class="logo-bracket">[</span><span class="logo-text">ssh-easy</span><span class="logo-bracket">]</span>
        <span class="logo-cursor">▋</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">
          <span class="nav-prefix">~/</span>home
        </a>
        <a href="{{ '/changelog/' | relative_url }}" class="nav-link{% if page.url contains 'changelog' %} active{% endif %}">
          <span class="nav-prefix">~/</span>changelog
        </a>
        <a href="{{ '/download/' | relative_url }}" class="nav-link{% if page.url contains 'download' %} active{% endif %}">
          <span class="nav-prefix">~/</span>download
        </a>
        <a href="https://github.com/WaschbaerImHaus/ssh-easy" class="nav-link nav-github" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
          GitHub
        </a>
      </nav>
    </div>
  </header>

  <main class="site-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-prompt">$</span>
      <span class="footer-text">ssh-easy · MIT License · by Kurt Ingwer</span>
      <span class="footer-releases">
        <a href="https://github.com/WaschbaerImHaus/ssh-easy/releases" target="_blank" rel="noopener">releases ↗</a>
      </span>
    </div>
  </footer>

  <script>
    // Typing-Cursor-Animation
    const cursor = document.querySelector('.logo-cursor');
    if (cursor) {
      setInterval(() => cursor.style.opacity = cursor.style.opacity === '0' ? '1' : '0', 530);
    }

    // Aktiven Nav-Link markieren
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.href === window.location.href) link.classList.add('active');
    });
  </script>
</body>
</html>
